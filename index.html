<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- pinça/zoom da página desligado: no jogo, pinça e rolagem aproximam a câmera (sem isso o HUD amplia e sai da tela) -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mars Outpost Trainer</title>
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="cena"></div>

<header class="hud topo">
  <div>
    <h1><span class="nome">Mars Outpost Trainer</span> <small id="local"></small>
      <span class="botoes"><button id="inicio" class="idioma"></button><button id="ajuda" class="idioma"></button><button id="idioma" class="idioma"></button><button id="som" class="idioma" hidden></button></span></h1>
    <div id="sol" class="sol">Sol 1</div>
    <div id="clima" class="clima"></div>
  </div>
  <div id="barras" class="barras"></div>
</header>

<div id="aviso" class="aviso" hidden role="alert">
  <span id="aviso-texto"></span>
  <button id="abrigo"></button>
</div>

<section id="diario" class="hud diario">
  <button id="diario-btn" class="diario-btn" aria-expanded="true" aria-controls="registro"></button>
  <div id="registro" class="registro" aria-live="polite"></div>
</section>

<footer id="base" class="hud base">
  <p id="acao" class="acao"></p>
  <div id="modulos" class="modulos"></div>
  <button id="proximo" class="proximo"></button>
</footer>

<div id="tutorial" class="tutorial" hidden>
  <div id="realce" class="realce"></div>
  <div id="balao" class="balao" role="dialog" aria-modal="true" aria-labelledby="tut-titulo">
    <small id="tut-passo"></small>
    <h2 id="tut-titulo"></h2>
    <div id="tut-texto"></div>
    <div class="tut-botoes">
      <button id="tut-pular" class="secundario"></button>
      <span></span>
      <button id="tut-voltar" class="secundario"></button>
      <button id="tut-proximo"></button>
    </div>
  </div>
</div>

<div id="dica" class="dica" hidden></div>
<div id="fim" class="fim" hidden>
  <div class="caixa">
    <h2 id="fim-titulo"></h2>
    <p id="fim-texto"></p>
    <h3 id="resumo-titulo"></h3>
    <ul id="resumo"></ul>
    <h3 id="aprendeu-titulo"></h3>
    <ul id="fatos"></ul>
    <p id="fontes" class="fontes"></p>
    <button id="reiniciar"></button>
    <button id="trocar" class="secundario"></button>
  </div>
</div>

<div id="escolha" class="escolha" hidden>
  <div class="caixa">
    <button id="escolha-idioma" class="idioma"></button>
    <h2 id="escolha-titulo"></h2>
    <p id="escolha-sub"></p>
    <div class="cartoes">
      <button data-missao="curiosity"><b>Curiosity</b><span id="desc-curiosity"></span></button>
      <button data-missao="perseverance"><b>Perseverance</b><span id="desc-perseverance"></span></button>
    </div>
    <p id="tripulada" class="tripulada"></p>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
