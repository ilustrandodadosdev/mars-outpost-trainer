<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mars Outpost Trainer</title>
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="cena"></div>

<header class="hud topo">
  <div>
    <h1>Mars Outpost Trainer <button id="idioma" class="idioma"></button></h1>
    <div id="sol" class="sol">Sol 1</div>
    <div id="clima" class="clima"></div>
  </div>
  <div id="barras" class="barras"></div>
</header>

<div id="aviso" class="aviso" hidden role="alert">
  <span id="aviso-texto"></span>
  <button id="abrigo"></button>
</div>

<aside id="registro" class="hud registro" aria-live="polite"></aside>

<footer class="hud base">
  <div id="modulos" class="modulos"></div>
  <button id="proximo" class="proximo"></button>
</footer>

<div id="dica" class="dica" hidden></div>
<div id="fim" class="fim" hidden>
  <div class="caixa">
    <h2 id="fim-titulo"></h2>
    <p id="fim-texto"></p>
    <h3 id="resumo-titulo"></h3>
    <ul id="resumo"></ul>
    <h3 id="aprendeu-titulo"></h3>
    <ul id="fatos"></ul>
    <p id="fontes" class="fontes"></p>
    <button id="reiniciar"></button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
